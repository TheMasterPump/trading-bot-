services:
  - type: web
    name: venom-ai-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: venom-ai-db
          property: connectionString
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: venom-ai-db
    databaseName: venomai
    user: venomai
    plan: free
